name: Build and deploy Aidoku source

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # src/zh.hipmh7/Cargo.lock is committed, so CI restores the exact
      # dependency graph the wasm was verified against. Nothing to regenerate.

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build source
        run: |
          set -eux
          cd src/zh.hipmh7
          # The committed lock pins aidoku 0.3.0 to the vendored local path,
          # but a path->path move still rewrites it; drop it and let cargo
          # resolve against the committed aidoku-rs-main copy.
          rm -f Cargo.lock
          cargo build --release --target wasm32-unknown-unknown

      - name: Package .aix
        run: |
          set -e
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE/Payload"
          cp src/zh.hipmh7/target/wasm32-unknown-unknown/release/hipmh.wasm "$STAGE/Payload/main.wasm"
          cp src/zh.hipmh7/res/source.json "$STAGE/Payload/source.json"
          cp src/zh.hipmh7/res/icon.png "$STAGE/Payload/icon.png"
          # bsdtar with forward slashes (PowerShell Compress-Archive breaks this)
          tar --format zip -cf "$STAGE/package.aix" -C "$STAGE" Payload
          VERSION=$(python3 -c "import json;print(json.load(open('src/zh.hipmh7/res/source.json'))['info']['version'])")
          mkdir -p dist
          cp "$STAGE/package.aix" "dist/zh.hipmh-v${VERSION}.aix"
          cp "$STAGE/package.aix" "dist/zh.hipmh.aix"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Generate list.json
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          version = int(os.environ["VERSION"])
          info = json.load(open("src/zh.hipmh7/res/source.json"))["info"]
          # Relative URLs: Aidoku resolves them against the list.json URL
          # itself (SourceList.swift -> ExternalSourceInfo.fileURL), so cdn /
          # mirror rewrites keep working.
          entry = {
              "id": info["id"],
              "name": info["name"],
              "version": version,
              "downloadURL": f"zh.hipmh-v{version}.aix",
              "iconURL": "icon.png",
              "languages": info.get("languages", ["zh"]),
              "contentRating": info.get("contentRating", 0),
              "altNames": ["hipmh", "Hippi Comics"],
              "minAppVersion": "0.7",
          }
          out = {"name": "嬉皮漫画 图源列表", "sources": [entry]}
          pathlib.Path("dist/list.json").write_text(json.dumps(out, ensure_ascii=False, indent=2))
          pathlib.Path("dist/index.min.json").write_text(json.dumps([entry], ensure_ascii=False, separators=(",", ":")))
          PY
          cat dist/list.json

      - name: Add icon and README
        run: |
          set -e
          cp src/zh.hipmh7/res/icon.png dist/icon.png
          printf '# 嬉皮漫画 Aidoku 图源（zh.hipmh）\n\n当前版本：v%s\n\n在 Aidoku「浏览 → 右上角 + → 图源列表」里粘贴：\n\n    <Pages 地址>/list.json\n\n以后在「更新」区点一下即可自动升级，无需 AirDrop。\n' "$VERSION" > dist/README.md

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

